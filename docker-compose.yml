services:
  db:

    image: postgres:16-alpine
    container_name: forensiq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-forensiq}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-forensiq}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"   # bind to loopback only — prevents LAN/public exposure

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forensiq_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: ForensiQ
      APP_ENV: production
      DEBUG: "false"
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-forensiq}
      SERVE_FRONTEND: "true"
      STATIC_DIR: /app/frontend
      UPLOAD_SOURCE_DIR: /app/data/sources
      UPLOAD_STAGING_DIR: /app/data/staging
    volumes:
      - evidence_sources:/app/data/sources
      - evidence_staging:/app/data/staging
    ports:
      - "127.0.0.1:8000:8000"   # bind to loopback only — prevents LAN/public exposure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    name: forensiq_postgres_data
  evidence_sources:
    name: forensiq_evidence_sources
  evidence_staging:
    name: forensiq_evidence_staging
